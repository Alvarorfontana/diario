name: Publicar Nota con IA

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema o borrador de la nota'
        required: true
      seccion:
        description: 'Sección'
        required: true
        default: 'Internacionales'

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install google-genai pygithub

      - name: Generar y publicar nota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_TEMA: ${{ github.event.inputs.tema }}
          INPUT_SECCION: ${{ github.event.inputs.seccion }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import datetime, re, os
          from google import genai
          from github import Github

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          fecha_actual = datetime.date.today().strftime('%Y-%m-%d')
          tema = os.environ['INPUT_TEMA']
          seccion = os.environ['INPUT_SECCION']

          prompt = f'''
          Actúa como un periodista profesional de política e internacionales.
          Redacta una nota periodística basada en las siguientes instrucciones:

          Tema: {tema}

          Instrucciones de formato:
          1. Genera un TÍTULO llamativo de máximo 12 palabras.
          2. Genera una DESCRIPCIÓN / COPETE breve de 2 líneas para SEO.
          3. Escribe el CUERPO de la nota en formato Markdown con subtítulos (##) e ideas bien estructuradas.
          4. NO incluyas el bloque --- de YAML ni título H1 (#) en el texto. Solo entrega el texto con esta estructura exacta:

          [TITULO]
          Escribe aquí solo el título

          [DESCRIPCION]
          Escribe aquí solo el copete

          [CUERPO]
          Escribe aquí todo el cuerpo de la nota en Markdown
          '''

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          texto_generado = response.text

          try:
              titulo = re.search(r'\[TITULO\]\s*(.*?)\s*\[DESCRIPCION\]', texto_generado, re.DOTALL).group(1).strip()
              descripcion = re.search(r'\[DESCRIPCION\]\s*(.*?)\s*\[CUERPO\]', texto_generado, re.DOTALL).group(1).strip()
              cuerpo = re.search(r'\[CUERPO\]\s*(.*)', texto_generado, re.DOTALL).group(1).strip()
          except Exception:
              titulo = 'Nota de actualidad periodística'
              descripcion = 'Análisis sobre los últimos acontecimientos.'
              cuerpo = texto_generado

          def crear_slug(texto):
              texto = texto.lower()
              texto = re.sub(r'[^\w\s-]', '', texto)
              return re.sub(r'[\s_-]+', '-', texto).strip('-')[:50]

          slug_nota = crear_slug(titulo)

          contenido_final = f'''---
          title: \"{titulo}\"
          description: \"{descripcion}\"
          seccion: \"{seccion}\"
          autor: \"Emilio Lahitte\"
          date: {fecha_actual}
          ---

          {cuerpo}
          '''

          g = Github(os.environ['GH_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])

          path_archivo = f'src/content/articulos/{fecha_actual}-{slug_nota}.md'

          repo.create_file(
              path=path_archivo,
              message=f'Feat: nueva nota {titulo}',
              content=contenido_final,
              branch='main'
          )
          print('Nota guardada con éxito')
          "

