name: Guardar foto debate Brasil
on:
  push:
    paths:
      - '.github/workflows/foto-debate-brasil.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guardar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotografía original
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            -H 'User-Agent: Mozilla/5.0' \
            -H 'Referer: https://agenciabrasil.ebc.com.br/' \
            'https://agenciabrasil.ebc.com.br/sites/default/files/thumbnails/image/2026/10/18/sem_titulo_1.jpg' \
            -o public/images/debate-lula-flavio-2026.jpg
          file public/images/debate-lula-flavio-2026.jpg
          file --mime-type public/images/debate-lula-flavio-2026.jpg | grep -q 'image/jpeg'
      - name: Incorporar imagen al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/debate-lula-flavio-2026.jpg
          git diff --cached --quiet || (git commit -m "Guardar fotografía del debate en el sitio" && git push)
