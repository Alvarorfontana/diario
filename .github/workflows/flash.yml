name: Video flash

# Arma los videos "Flash" (semanal o de último momento) que se cargan desde
# /admin/flash. El panel guarda el flash con estado "generar" y este proceso
# lo convierte en video (voz neural, placas del diario, fotos, videos y música).
# Tarda unos minutos. El resultado queda en public/flash/<id>.mp4.
on:
  push:
    branches: [main]
    paths:
      - 'data/flash/*.json'
  workflow_dispatch:
    inputs:
      id:
        description: 'Id del flash a regenerar (vacío = los que esperan)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: video-flash
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramientas
        run: |
          pip install edge-tts pillow numpy yt-dlp
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      # Voz clonada de Álvaro (Chatterbox, MIT): sólo se instala si algún flash pendiente la pide
      - name: Instalar la voz clonada
        run: |
          if grep -l '"voz": *"clonada"' data/flash/*.json >/dev/null 2>&1; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
            pip install chatterbox-tts
          else
            echo "Ningún flash usa la voz clonada."
          fi

      # Diseño OpenFilm (MIT, gratis): Node y el navegador que dibuja las escenas, sólo si algún flash lo pide
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar OpenFilm
        run: |
          if python3 -c "import json,glob,sys; sys.exit(0 if any((lambda d: d.get('estilo')=='openfilm' and d.get('estado')=='generar')(json.load(open(f))) for f in glob.glob('data/flash/*.json') if isinstance(json.load(open(f)), dict)) else 1)" 2>/dev/null; then
            npx -y openfilm@0.3.2 --version
            npx -y playwright@latest install-deps chromium || true
          else
            echo "Ningún flash usa el diseño OpenFilm."
          fi

      - name: Generar videos
        env:
          PYTHONUNBUFFERED: '1'
          VOZ_CLAVE: ${{ secrets.VOZ_CLAVE }}
          VOZ_REFERENCIA_B64: ${{ secrets.VOZ_REFERENCIA_B64 }}
        run: python scripts/flash/generar-flash.py ${{ inputs.id }}

      - name: Guardar en el repositorio
        if: always()
        run: |
          # Firmado como el dueño del repo: Vercel no publica commits de otros autores
          git config user.name "Alvarorfontana"
          git config user.email "alvarorfontana@gmail.com"
          git add -A public/flash data/flash/*.json
          if git diff --cached --quiet; then
            echo "No hay videos nuevos."
            exit 0
          fi
          git commit -m "Video flash generado"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
