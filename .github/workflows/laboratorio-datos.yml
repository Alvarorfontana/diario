name: Laboratorio de datos (actualización diaria)

# Una vez por día baja las series públicas (INDEC, BCRA, dólar, riesgo país, FMI)
# y las guarda en data/laboratorio/. La página /datos/ se arma con esos archivos.
# También se puede correr a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '23 22 * * *'   # 19:23 hora argentina, después del cierre de mercado
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/datos/actualizar-laboratorio.mjs'
      - '.github/workflows/laboratorio-datos.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar las series
        run: node scripts/datos/actualizar-laboratorio.mjs

      - name: Guardar en el repositorio
        run: |
          # Firmado como el dueño del repo: Vercel no publica commits de otros autores
          git config user.name "Alvarorfontana"
          git config user.email "alvarorfontana@gmail.com"
          git add -A data/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Laboratorio de datos: actualización diaria"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
