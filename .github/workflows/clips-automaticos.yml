name: Clips automáticos Diario Federal
on:
  push:
    branches: [main, feature/clips-automaticos]
    paths:
      - 'data/clips/trabajos/*.json'
      - 'data/clips/aprobaciones/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clips-automaticos
  cancel-in-progress: false
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install faster-whisper edge-tts
      - name: Generar clips para revisión
        run: python scripts/clips/generar-clips.py
      - name: Publicar sólo los clips aprobados
        run: python scripts/clips/publicar-aprobados.py
      - name: Guardar resultados
        run: |
          git config user.name "Alvarorfontana"
          git config user.email "alvarorfontana@gmail.com"
          git add public/clips data/clips src/lib/clips-generados.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Procesar clips y publicar sólo los aprobados"
          git push
