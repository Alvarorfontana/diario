name: Incorporar foto Caputo y Bausili
on:
  push:
    paths:
      - '.github/workflows/foto-oro-bcra.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guardar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar foto CC BY 4.0
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            -H 'User-Agent: DiarioFederal/1.0 (editorial)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/CaputoBausili.jpg' \
            -o public/images/caputo-bausili-oro-bcra.jpg
          file --mime-type public/images/caputo-bausili-oro-bcra.jpg | grep -q 'image/jpeg'
      - name: Publicar foto local
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/caputo-bausili-oro-bcra.jpg
          git diff --cached --quiet || (git commit -m "Incorporar fotografía Caputo Bausili con licencia CC BY 4.0" && git push)
