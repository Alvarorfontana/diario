<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Intención de voto en España al 27 de noviembre de 2026: PP 30,9%, PSOE 28,9%, Vox 18,1%, Frente Amplio 6,3%">
