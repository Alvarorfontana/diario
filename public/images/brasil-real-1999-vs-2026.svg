<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Suba del dólar en Brasil: 77% en enero de 1999 y 12,6% en octubre de 2026"><rect width="900" height="360" fill="#f8fafc"/><text x="42" y="56" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#142338">El dólar saltó 77% en Brasil en 1999; ahora, 12,6%</text><text x="42" y="86" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#536071">Suba del dólar en reales, del último cierre estable al pico de la corrida</text><text x="196" y="163" font-size="19" font-family="Arial, Helvetica, sans-serif" text-anchor="end" fill="#23334a">Enero 1999</text><rect x="210" y="130" width="440.0" height="50" rx="4" fill="#b8c2cc"/><text x="662.0" y="152" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">+77%</text><text x="662.0" y="174" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#536071">R$ 1,21 → R$ 2,15</text><text x="196" y="243" font-size="19" font-family="Arial, Helvetica, sans-serif" text-anchor="end" fill="#23334a">Octubre 2026</text><rect x="210" y="210" width="71.7" height="50" rx="4" fill="#17649d"/><text x="293.7" y="232" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">+12,6%</text><text x="293.7" y="254" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#536071">R$ 4,99 → R$ 5,60</text><line x1="42" y1="302" x2="858" y2="302" stroke="#cdd6df"/><text x="42" y="332" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#536071">Fuentes: IPS/SUNS (13 al 29 de enero de 1999); ABC Economía y Revista Mercado (23 al 26 de octubre de 2026).</text></svg>