<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Peso de Brasil: 64,5% de las ventas a Brasil son manufacturas industriales, 63% de los autos exportados van a Brasil, 27,7% del tipo de cambio real multilateral, 21,4% de las importaciones y 12,7% de las exportaciones"><rect width="900" height="520" fill="#f8fafc"/><text x="42" y="56" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#142338">Casi dos de cada tres autos exportados van a Brasil</text><text x="42" y="86" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#536071">Cuánto pesa Brasil en la economía argentina, en %. Enero-septiembre de 2026</text><text x="42" y="128" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#23334a">Exportaciones a Brasil que son manufacturas industriales</text><rect x="42" y="137" width="700" height="22" rx="3" fill="#e6ebf0"/><rect x="42" y="137" width="451.5" height="22" rx="3" fill="#b8c2cc"/><text x="756" y="155" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">64,5%</text><text x="42" y="194" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#23334a">Autos exportados que van a Brasil</text><rect x="42" y="203" width="700" height="22" rx="3" fill="#e6ebf0"/><rect x="42" y="203" width="441.0" height="22" rx="3" fill="#17649d"/><text x="756" y="221" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">63%</text><text x="42" y="260" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#23334a">Peso de Brasil en el tipo de cambio real multilateral</text><rect x="42" y="269" width="700" height="22" rx="3" fill="#e6ebf0"/><rect x="42" y="269" width="193.9" height="22" rx="3" fill="#b8c2cc"/><text x="756" y="287" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">27,7%</text><text x="42" y="326" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#23334a">Importaciones argentinas que vienen de Brasil</text><rect x="42" y="335" width="700" height="22" rx="3" fill="#e6ebf0"/><rect x="42" y="335" width="149.8" height="22" rx="3" fill="#b8c2cc"/><text x="756" y="353" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">21,4%</text><text x="42" y="392" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#23334a">Exportaciones argentinas que van a Brasil</text><rect x="42" y="401" width="700" height="22" rx="3" fill="#e6ebf0"/><rect x="42" y="401" width="88.9" height="22" rx="3" fill="#b8c2cc"/><text x="756" y="419" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#142338">12,7%</text><line x1="42" y1="462" x2="858" y2="462" stroke="#cdd6df"/><text x="42" y="492" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#536071">Fuentes: INDEC, Intercambio comercial argentino (sep. 2026); ADEFA vía El Día; PPI sobre datos del BCRA. Fondo gris = 100%.</text></svg>