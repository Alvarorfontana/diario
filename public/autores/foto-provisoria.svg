    <!-- cuello -->
    <path d="M86 112h28v28c-8 6-20 6-28 0z" fill="#c99877"/>
    <!-- cara -->
    <ellipse cx="100" cy="90" rx="34" ry="40" fill="#dbab88"/>
    <ellipse cx="66" cy="94" rx="6" ry="9" fill="#cf9f7d"/>
    <ellipse cx="134" cy="94" rx="6" ry="9" fill="#cf9f7d"/>
    <!-- pelo -->
    <path d="M65 84c-3-30 14-46 37-46 22 0 37 14 34 44-6-14-16-22-34-24-16 2-28 10-37 26z" fill="#3a2a22"/>
