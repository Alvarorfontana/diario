# NUNCA commitear valores reales acá:
# GITHUB_PAT = "..."
# ADMIN_PASSWORD = "..."
# NOTIFY_EMAIL = "alvarorfontana@gmail.com"
# RESEND_API_KEY = "re_..." (opcional)
