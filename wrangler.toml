name = "diario-digital"
compatibility_date = "2026-08-28"
# nodejs_compat ya no es estrictamente necesario con los endpoints portables,
# pero se mantiene como red de seguridad por si otras dependencias lo requieren.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist/client"

[vars]
